<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&family=Sono:wght,MONO@200..800,1&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./style.css">


  <title>Frontend Mentor | Ping coming soon page</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav"> 
      <img src="./images/logo.svg" alt="image of the logo">
    </div>

  
   <div class="hero">
     <div> 
       <h1> We are launching <span class="span">soon!</span></h1>
     </div>
     <div class="p">
       <p>Subscribe and get notified</p> 
      </div>
      <div class="btn">
          <form action="" method="post">
            <label for="email"></label>
            <input id="email" type="email" name="user-email" placeholder="Your email address" required class="form-input">
            <span class="error-msg" >Please enter a valid email address</span>
            <button type="submit">Notify Me</button>
          </form>
     </div>
    </div>

    <div class="img">
      <img class="pic" src="./images/illustration-dashboard.png" alt="picture">
    </div>

    <div class="bottom">
      <div class="icons">
        <a href="www.facebook"><img class="icon" src="./images/logo-facebook.svg" alt="facebook icon"></a>
        <a href="www.twitter"><img class="icon" src="./images/twitter-square-color-icon.svg" alt="twitter icon"></a>
        <a href="wwww.instagram"><img class="icon" src="./images/black-instagram-icon.svg" alt="instagram logo"></a>
      </div>
      
      <div>
       <p>&copy Copyright Ping. All right reserved.</p>
      </div>
    </div>
    

    <footer>
     <p class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
        Coded by <a href="#">Your Name Here</a>.
      </p>
   </footer>
  </div>
</body>
</html>
